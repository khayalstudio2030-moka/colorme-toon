<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة الطلبات — ColorMe Toon</title>
  <link rel="icon" href="/img/logo.png" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .adm { max-width: 1000px; margin: 30px auto; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 20px; }
    .ord { display: grid; grid-template-columns: 160px 1fr; gap: 18px; border: 3px solid var(--ink); border-radius: 18px; padding: 16px; margin-bottom: 16px; background: #fff; box-shadow: 4px 4px 0 var(--ink); }
    .ord .rc { width: 160px; height: 200px; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); background: #f4f4f4; cursor: zoom-in; display: grid; place-items: center; font-size: 13px; text-align: center; }
    .ord h3 { margin: 0 0 6px; }
    .ord .meta { font-size: 14px; line-height: 1.9; }
    .ord .meta b { display: inline-block; min-width: 90px; }
    .ord .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .badge { display: inline-block; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 700; background: #eee; }
    .badge.awaiting_review { background: var(--yellow); } .badge.ready { background: #9be39b; } .badge.processing, .badge.paid { background: var(--green); }
    .badge.payment_rejected, .badge.failed { background: #ffb3b3; }
    .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
    .wa { font-size: 14px; }
    .badge.free { background: #ffd6f0; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    @media (max-width: 600px) { .ord { grid-template-columns: 1fr; } .ord .rc { width: 100%; height: 260px; } }
    .st-sec { border: 3px solid var(--ink); border-radius: 18px; padding: 16px; margin: 14px 0 22px; background: #fff; box-shadow: 4px 4px 0 var(--ink); }
    .st-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
    .st-kpi { border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: #fffbea; }
    .st-kpi b { display: block; font-size: 26px; line-height: 1.2; }
    .st-kpi span { font-size: 13px; color: var(--muted); }
    .fun { margin: 8px 0 4px; }
    .fun-row { display: grid; grid-template-columns: 150px 1fr 120px; gap: 10px; align-items: center; margin: 7px 0; font-size: 14px; }
    .fun-bar { height: 26px; border: 2px solid var(--ink); border-radius: 8px; background: #f2f2f2; overflow: hidden; }
    .fun-bar i { display: block; height: 100%; background: var(--green, #7bd389); }
    .fun-row .drop { font-size: 12px; color: #c0392b; }
    .fun-row.worst .fun-bar { box-shadow: 0 0 0 3px #ffb3b3; }
    .st-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .st-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .st-tbl th, .st-tbl td { border-bottom: 1px solid #ddd; padding: 5px 6px; text-align: center; }
    .st-tbl th { background: #f6f6f6; }
    .st-note { background: #fff3cd; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
    @media (max-width: 600px) { .st-cols { grid-template-columns: 1fr; } .fun-row { grid-template-columns: 105px 1fr 82px; font-size: 13px; } }
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><a href="/" class="brand" style="text-decoration:none"><img src="/img/logo.png" alt="ColorMe Toon" /> <span><b>ColorMe</b> <i>Toon</i></span></a></div></header>
  <main class="wrap adm">
    <section class="card" id="login" style="display:none;max-width:480px;margin:auto">
      <h2>لوحة الطلبات</h2>
      <label class="lbl" for="key">مفتاح الأدمن</label>
      <input type="password" id="key" autocomplete="current-password" />
      <p class="err" id="lerr" style="color:#c0392b"></p>
      <button class="btn" id="enter">دخول</button>
    </section>
    <section id="panel" style="display:none">
      <h2>الطلبات <button class="btn alt small" id="refresh" style="margin-inline-start:10px">تحديث ↻</button> <button class="chip" id="logout" style="float:left">خروج</button></h2>
      <div class="tools">
        <a class="btn small" href="/?free=1" target="_blank">🎁 اعمل طلب مجاني</a>
        <button class="btn alt small" id="statsBtn">📊 الإحصائيات</button>
        <span id="wa" class="wa"></span>
      </div>
      <section class="st-sec" id="stats" style="display:none"></section>
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
    </section>
  </main>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/admin.js"></script>
  <script src="/motion.js"></script>
</body>
</html>
